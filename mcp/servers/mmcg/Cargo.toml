[package]
name = "mmcg"
version = "0.13.0"
edition = "2021"
rust-version = "1.75"
description = "Mastermind Codegraph — fast multi-language code indexer (Python, TypeScript, JavaScript, Rust, C#, Go, Java, PHP, C/C++) with MCP interface. Truth layer for AI coding agents."
authors = ["mastermind"]
license = "MIT"
repository = "https://github.com/xcrft/mastermind"
homepage = "https://github.com/xcrft/mastermind"
documentation = "https://github.com/xcrft/mastermind/blob/main/mcp/servers/mmcg/README.md"
readme = "README.md"
keywords = ["mcp", "codegraph", "indexer", "tree-sitter", "ai-agents"]
categories = ["development-tools", "command-line-utilities", "parser-implementations"]
# Keep the published tarball small — exclude build output, smoke fixtures, etc.
exclude = [
    "target/*",
    "*.db",
    "*.db-shm",
    "*.db-wal",
    ".mastermind/*",
]

[[bin]]
name = "mmcg"
path = "src/main.rs"

[lib]
name = "mmcg"
path = "src/lib.rs"

[dependencies]
# SQLite with bundled C library — no system libsqlite3 dependency
rusqlite = { version = "0.39", features = ["bundled"] }

# tree-sitter — fastest mature parser. Each grammar vendors its own C source.
# No system tree-sitter library required.
tree-sitter = "0.26"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-javascript = "0.25"
tree-sitter-c-sharp = "0.23"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"
tree-sitter-php = "0.23"
tree-sitter-cpp = "0.23"

# Data-parallel iterator — used to parse multiple files concurrently.
rayon = "1.10"

# Cross-platform filesystem watcher for `mmcg watch`.
notify = "8.2"

# JSON for MCP protocol
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI argument parsing
clap = { version = "4.5", features = ["derive", "env"] }

# Filesystem walking
walkdir = "2.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
