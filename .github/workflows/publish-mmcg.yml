# Publish the `mmcg` crate to crates.io.
#
# Trigger: pushing a tag of the form `mmcg-v<semver>`, e.g. `mmcg-v0.6.0`.
# The tag MUST match the `version` field in `mcp/servers/mmcg/Cargo.toml`; the
# verify job hard-fails otherwise to prevent shipping a mismatched release.
#
# Setup (one-time):
#   Settings → Environments → `prod` → Secrets → CARGO_REGISTRY_TOKEN
#     Get the token from https://crates.io/me (API tokens).
#   Optional but recommended: add a "Required reviewers" rule on the `prod`
#   environment so a human approves before `cargo publish` runs.
#
# Layout: two jobs.
#   `verify` runs always (tag check, validator, tests, package). No secrets,
#     no environment — so tests don't wait on approval gates.
#   `publish` only runs if verify passes, uses environment `prod` so the
#     CARGO_REGISTRY_TOKEN is in scope and any env protection rules kick in.
#
# Release procedure:
#   1. Bump version in mcp/servers/mmcg/Cargo.toml (+ README frontmatter +
#      plugins/mmcg/.claude-plugin/plugin.json + .claude-plugin/marketplace.json)
#   2. `just check` — validator passes (template mirrors in sync, etc.)
#   3. Commit the bump on main
#   4. Tag and push: `git tag mmcg-v0.6.0 && git push origin mmcg-v0.6.0`
#   5. This workflow: verify → (approval if configured) → publish

name: Publish mmcg to crates.io

on:
  push:
    tags:
      - "mmcg-v*"
  # Manual dry-runs from the Actions tab — runs verify only, never publishes.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — verify only, no publish (default: true)"
        type: boolean
        default: true

concurrency:
  group: publish-mmcg-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify (tag + validator + tests + package)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp/servers/mmcg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mcp/servers/mmcg/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('mcp/servers/mmcg/Cargo.lock') }}

      - name: Verify tag matches Cargo.toml version
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF_NAME}"
          TAG_VERSION="${TAG#mmcg-v}"
          CARGO_VERSION=$(awk -F'"' '/^version *=/ {print $2; exit}' Cargo.toml)
          echo "tag=${TAG_VERSION}  cargo=${CARGO_VERSION}"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::tag version ($TAG_VERSION) does not match Cargo.toml ($CARGO_VERSION). Bump Cargo.toml or retag." >&2
            exit 1
          fi

      - name: Run repo validator (template mirrors must be in sync)
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          python scripts/validate.py

      - name: cargo test
        run: cargo test --lib --release

      - name: cargo package (builds the tarball that would ship to crates.io)
        run: cargo package

      - name: Stash packaged crate for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: mmcg-crate
          path: mcp/servers/mmcg/target/package/*.crate
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish to crates.io
    needs: verify
    # Skip when:
    #   - this is a workflow_dispatch dry-run (default true), OR
    #   - the workflow is running on a fork (forks don't have CARGO_REGISTRY_TOKEN
    #     in their `prod` environment; without this guard, the job would start, hit
    #     the env gate, and fail noisily after waiting on reviewers).
    if: |
      github.repository == 'xcrft/mastermind' &&
      (github.event_name == 'push' || github.event.inputs.dry_run == 'false')
    runs-on: ubuntu-latest
    # Pulls CARGO_REGISTRY_TOKEN from the `prod` environment and triggers any
    # protection rules configured on it (required reviewers, wait timer, etc.).
    environment: prod
    defaults:
      run:
        working-directory: mcp/servers/mmcg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish

  dry-run-notice:
    name: Dry-run notice
    needs: verify
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'false'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Dry run complete — verify passed (package built clean). No publish performed."
