# Per-PR validation for the npm distribution layer.
#
# `ci-mmcg.yml` covers the Rust crate (6-target build + test matrix). This
# workflow covers the JS wrappers + the npm packaging integration — so a
# broken wrapper or a packaging mistake surfaces at PR time, not at release.
#
# This job reports a required context, so it runs on every PR rather than using
# path filters that can leave branch protection Pending. Single Linux job (the
# cross-platform
# binary resolution is covered by the release workflow's per-target builds):
#   1. `node --check` both wrappers (fast syntax gate)
#   2. build mmcg for the host (linux-x64-gnu, native)
#   3. assemble the linux-x64-gnu platform package via the shared helper
#   4. `npm pack` root + platform
#   5. install both from local tarballs and run the binary through the wrapper
#   6. assert install-mode detection writes the right MCP `command` per mode
#
# This is the "did the whole chain survive this change" smoke that the audit
# (correctly) flagged as missing from PR CI.

name: CI — npm

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-npm-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  npm-smoke:
    name: wrapper check + linux-x64 install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: node --check both wrappers (syntax gate)
        run: |
          set -e
          node --check npm/mastermind/bin/mastermind.js
          node --check npm/mastermind/bin/mmcg.js
          node --check npm/mastermind/bin/install.js
          echo "✓ wrapper syntax OK"

      - name: Workflow installer contract tests
        run: npm test --prefix npm/mastermind

      - name: Validate root package.json shape
        run: |
          set -e
          node -e '
            const p = require("./npm/mastermind/package.json");
            const bins = Object.keys(p.bin || {});
            if (!bins.includes("mastermind") || !bins.includes("mmcg")) {
              throw new Error("root package must expose `mastermind` and `mmcg` bins");
            }
            const opt = Object.keys(p.optionalDependencies || {});
            if (opt.length !== 7) {
              throw new Error(`expected 7 optionalDependencies, found ${opt.length}`);
            }
            // every optional dep version must equal the root version (lockstep release)
            for (const [name, ver] of Object.entries(p.optionalDependencies)) {
              if (ver !== p.version) {
                throw new Error(`${name} pinned to ${ver}, root is ${p.version} — versions must match`);
              }
            }
            console.log("✓ root package.json shape OK (7 platform deps, versions in lockstep)");
          '

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mcp/servers/mmcg/target
          key: ${{ runner.os }}-npm-smoke-cargo-${{ hashFiles('mcp/servers/mmcg/Cargo.lock') }}

      - name: Build mmcg (host = linux-x64-gnu)
        working-directory: mcp/servers/mmcg
        run: cargo build --release --locked

      - name: Assemble linux-x64-gnu platform package
        run: ./scripts/build-npm-packages.sh x86_64-unknown-linux-gnu mcp/servers/mmcg/target/release/mmcg

      - name: npm pack root + platform
        run: |
          set -e
          bash scripts/stage-npm-share.sh   # stage subagents + skills into npm/mastermind/share/
          mkdir -p packed
          (cd npm/mastermind && npm pack --pack-destination "$GITHUB_WORKSPACE/packed")
          (cd npm/platforms/linux-x64-gnu && npm pack --pack-destination "$GITHUB_WORKSPACE/packed")
          if tar tzf "$GITHUB_WORKSPACE/packed/xcraftmind-mastermind-$(node -p "require('./npm/mastermind/package.json').version").tgz" | grep -Eq '(^|/)__pycache__(/|$)|\.py[co]$'; then
            echo "::error::root npm tarball contains Python bytecode cache files"
            exit 1
          fi
          ls -la packed/

      - name: Install from tarballs + smoke the wrapper
        run: bash scripts/smoke-packed-npm-release.sh "$GITHUB_WORKSPACE/packed" npm/mastermind/package.json linux-x64-gnu
