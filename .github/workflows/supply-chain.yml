name: Supply-chain policy

on:
  pull_request:
    paths:
      - "mcp/servers/mmcg/Cargo.toml"
      - "mcp/servers/mmcg/Cargo.lock"
      - "deny.toml"
      - ".github/workflows/supply-chain.yml"
  push:
    branches: [main]
    paths:
      - "mcp/servers/mmcg/Cargo.toml"
      - "mcp/servers/mmcg/Cargo.lock"
      - "deny.toml"
      - ".github/workflows/supply-chain.yml"
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cargo-deny:
    name: advisories, licenses, bans, sources
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Enforce Cargo supply-chain policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: mcp/servers/mmcg/Cargo.toml
          command: check
          arguments: --all-features
