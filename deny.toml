[graph]
all-features = true

[advisories]
ignore = []
# Fail on unmaintained crates anywhere in the tree, not only direct dependencies.
unmaintained = "all"

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"
exceptions = [
    { allow = ["CC0-1.0"], crate = "notify@9.0.0" },
    { allow = ["BSL-1.0"], crate = "xxhash-rust@0.8.21" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
