name: Validate artifacts

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    name: Frontmatter & cross-references
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install validator dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run validator
        run: python scripts/validate.py

      - name: Run audit workflow security fixtures
        run: python scripts/test_audit_workflow_security.py
