# Publish the `mmcg` crate to crates.io.
#
# Trigger: pushing a tag of the form `mmcg-v<semver>`, e.g. `mmcg-v0.6.0`.
# The tag MUST match the `version` field in `mcp/servers/mmcg/Cargo.toml`; the
# verify job hard-fails otherwise to prevent shipping a mismatched release.
#
# Setup (one-time):
#   Settings → Environments → `prod` → Secrets → CARGO_REGISTRY_TOKEN
#     Get the token from https://crates.io/me (API tokens).
#   Optional but recommended: add a "Required reviewers" rule on the `prod`
#   environment so a human approves before the exact artifact upload runs.
#
# Layout: two jobs.
#   `verify` runs always (tag check, validator, tests, package). It prepares
#     Cargo registry metadata beside the verified `.crate` and seals both with
#     SHA-256. No secrets, no environment — tests don't wait on approval gates.
#   `publish` only runs if verify passes, downloads those exact bytes, checks
#     their hashes, and uploads the verified `.crate` through Cargo's documented
#     registry Web API. It never asks `cargo publish` to package the source again.
#
# Release procedure:
#   1. Bump version in mcp/servers/mmcg/Cargo.toml (+ README frontmatter)
#   2. `just check` — validator passes (template mirrors in sync, etc.)
#   3. Commit the bump on main
#   4. Tag and push: `git tag mmcg-v0.6.0 && git push origin mmcg-v0.6.0`
#   5. This workflow: verify → (approval if configured) → publish

name: Publish mmcg to crates.io

on:
  push:
    tags:
      - "mmcg-v*"
  # Manual runs from the Actions tab are verify-only and can never publish.
  workflow_dispatch:

concurrency:
  group: publish-mmcg-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify (tag + validator + tests + package)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp/servers/mmcg

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install Python for validator and artifact publisher
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Cache cargo registry + target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mcp/servers/mmcg/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('mcp/servers/mmcg/Cargo.lock') }}

      - name: Verify tag matches Cargo.toml version
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF_NAME}"
          TAG_VERSION="${TAG#mmcg-v}"
          CARGO_VERSION=$(awk -F'"' '/^version *=/ {print $2; exit}' Cargo.toml)
          echo "tag=${TAG_VERSION}  cargo=${CARGO_VERSION}"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::tag version ($TAG_VERSION) does not match Cargo.toml ($CARGO_VERSION). Bump Cargo.toml or retag." >&2
            exit 1
          fi

      - name: Verify release commit is reachable from main
        if: github.event_name == 'push'
        working-directory: .
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main || {
            echo "::error::release tag must point to a commit reachable from main" >&2
            exit 1
          }

      - name: Run repo validator (template mirrors must be in sync)
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r scripts/requirements.txt
          python scripts/validate.py

      - name: cargo test --all --release --locked
        run: cargo test --all --release --locked

      - name: cargo package (builds the tarball that would ship to crates.io)
        run: cargo package --locked

      - name: Bind registry metadata and checksums to the verified crate
        working-directory: .
        run: |
          set -euo pipefail
          version=$(awk -F'"' '/^version *=/ {print $2; exit}' mcp/servers/mmcg/Cargo.toml)
          source_crate="mcp/servers/mmcg/target/package/mmcg-${version}.crate"
          test -f "$source_crate" && test ! -L "$source_crate" || {
            echo "::error::expected packaged artifact $source_crate" >&2
            exit 1
          }
          mkdir release-crate
          crate="release-crate/mmcg-${version}.crate"
          cp "$source_crate" "$crate"
          python3 scripts/publish-crate-artifact.py prepare \
            --crate "$crate" \
            --output "$crate.publish.json"
          crate_dir=$(dirname "$crate")
          crate_name=$(basename "$crate")
          (
            cd "$crate_dir"
            sha256sum "$crate_name" "$crate_name.publish.json" >SHA256SUMS
          )

      - name: Stash packaged crate for the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mmcg-crate
          path: release-crate/
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish to crates.io
    needs: verify
    # Tag pushes from the canonical repository are the only publish authority.
    # Forks do not have CARGO_REGISTRY_TOKEN in their `prod` environment.
    if: |
      github.repository == 'xcrft/mastermind' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Pulls CARGO_REGISTRY_TOKEN from the `prod` environment and triggers any
    # protection rules configured on it (required reviewers, wait timer, etc.).
    environment: prod
    defaults:
      run:
        working-directory: mcp/servers/mmcg

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download verified crate artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mmcg-crate
          path: verified-crate

      - name: Install Python for exact artifact publisher
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Publish exact verified crate bytes
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        working-directory: .
        run: |
          set -euo pipefail
          cd verified-crate
          sha256sum --check SHA256SUMS
          set -- *.crate
          test "$#" = 1 && test -f "$1" || {
            echo "::error::expected exactly one verified .crate artifact" >&2
            exit 1
          }
          crate=$1
          expected_sha256=$(awk -v file="$crate" '$2 == file {print $1}' SHA256SUMS)
          test -n "$expected_sha256"
          python3 "$GITHUB_WORKSPACE/scripts/publish-crate-artifact.py" publish \
            --crate "$crate" \
            --metadata "$crate.publish.json" \
            --expected-sha256 "$expected_sha256"

  dry-run-notice:
    name: Dry-run notice
    needs: verify
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Dry run complete — verify passed (package built clean). No publish performed."
