name: Mastermind verifiable audit
description: Verify changed task contracts and produce policy-bound schema-v3 audit envelopes
inputs:
  root:
    description: Repository root below GITHUB_WORKSPACE
    default: .
  since:
    description: Exact full baseline commit OID
    required: true
  bundle-dir:
    description: New repository-relative output directory
    default: .mastermind/audit-output
  expected-repository:
    description: Expected GitHub owner/repo identity
    required: true
  expected-baseline:
    description: Expected full baseline commit OID
    required: true
  expected-head:
    description: Expected full HEAD commit OID
    required: true
  require-clean-worktree:
    description: Reject any dirty snapshot
    default: "true"
outputs:
  bundle-dir:
    description: Verified envelope directory, repository-relative to GITHUB_WORKSPACE
  result-json:
    description: Aggregate verification result path, repository-relative to GITHUB_WORKSPACE
runs:
  using: docker
  image: Dockerfile.audit-action
